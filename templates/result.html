<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results — Object Outline Detector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-job-id="{{ job_id }}">

<div class="aurora">
  <span class="blob blob-a"></span>
  <span class="blob blob-b"></span>
  <span class="blob blob-c"></span>
</div>

<div class="results-page">

  <header class="results-header">
    <a href="/" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      New image
    </a>
    <h1>Analysis <span class="accent-text">Results</span></h1>
  </header>

  <main id="results-content" class="results-content" hidden>

    <section class="glass-card hero-card">
      <h2 class="section-title">Original Image</h2>
      <div class="hero-img-wrap">
        <img id="hero-img" alt="Original uploaded image">
      </div>
    </section>

    <section class="grid-section">
      <h2 class="section-title">Pipeline Outputs</h2>
      <div id="results-grid" class="grid"></div>
    </section>

  </main>

</div>

<script src="{{ url_for('static', filename='js/result.js') }}"></script>
</body>
</html>
